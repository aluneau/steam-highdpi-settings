---
# Ansible Playbook: Steam HiDPI Scaling for Linux
# Fixes tiny Steam interface on 4K displays
#
# Usage:
#   ansible-playbook steam-highdpi.yml
# Or with custom scale:
#   ansible-playbook steam-highdpi.yml -e "steam_scale=2.0"

- name: Configure Steam HiDPI Scaling
  hosts: localhost
  connection: local
  gather_facts: true
  
  vars:
    # Default scaling factor - adjust as needed
    # 1.5 = 150% (27" 4K, dense)
    # 1.75 = 175% (27-32" 4K, comfortable)  
    # 2.0 = 200% (32"+ 4K or TV, large)
    steam_scale: "1.75"
    
    # User paths
    user_home: "{{ ansible_env.HOME }}"
    steam_desktop_source: "/usr/share/applications/steam.desktop"
    steam_desktop_target: "{{ user_home }}/.local/share/applications/steam.desktop"
    env_dir: "{{ user_home }}/.config/environment.d"
    env_file: "{{ env_dir }}/steam-scaling.conf"
  
  tasks:
    - name: Ensure environment.d directory exists
      file:
        path: "{{ env_dir }}"
        state: directory
        mode: '0755'
      
    - name: Create Steam scaling environment file
      copy:
        dest: "{{ env_file }}"
        content: |
          # Steam HiDPI scaling for 4K displays
          # Generated by Ansible playbook
          # Scale: {{ steam_scale }} ({{ steam_scale | float * 100 | int }}%)
          STEAM_FORCE_DESKTOPUI_SCALING={{ steam_scale }}
          GDK_SCALE={{ steam_scale }}
          GDK_DPI_SCALE={{ steam_scale }}
        mode: '0644'
      register: env_file_changed
    
    - name: Ensure local applications directory exists
      file:
        path: "{{ user_home }}/.local/share/applications"
        state: directory
        mode: '0755'
    
    - name: Check if system steam.desktop exists
      stat:
        path: "{{ steam_desktop_source }}"
      register: system_desktop_stat
    
    - name: Copy system steam.desktop to user directory
      copy:
        src: "{{ steam_desktop_source }}"
        dest: "{{ steam_desktop_target }}"
        remote_src: true
        mode: '0755'
      when: system_desktop_stat.stat.exists
      
    - name: Update Exec line in desktop file
      lineinfile:
        path: "{{ steam_desktop_target }}"
        regexp: '^Exec=.*steam'
        line: 'Exec=env STEAM_FORCE_DESKTOPUI_SCALING={{ steam_scale }} GDK_SCALE={{ steam_scale }} GDK_DPI_SCALE={{ steam_scale }} /usr/bin/steam %U'
        backup: true
      when: system_desktop_stat.stat.exists
    
    - name: Update all Action Exec lines (Store, Library, etc.)
      replace:
        path: "{{ steam_desktop_target }}"
        regexp: 'Exec=/usr/bin/steam (steam://[^\s]*)'
        replace: 'Exec=env STEAM_FORCE_DESKTOPUI_SCALING={{ steam_scale }} GDK_SCALE={{ steam_scale }} GDK_DPI_SCALE={{ steam_scale }} /usr/bin/steam \1'
      when: system_desktop_stat.stat.exists
    
    - name: Update desktop database
      command: update-desktop-database "{{ user_home }}/.local/share/applications/"
      changed_when: true
      
    - name: Display completion message
      debug:
        msg:
          - "Steam HiDPI scaling configured successfully!"
          - ""
          - "Scale set to: {{ steam_scale }} ({{ steam_scale | float * 100 | int }}%)"
          - ""
          - "Files modified:"
          - "  - {{ env_file }}"
          - "  - {{ steam_desktop_target }}"
          - ""
          - "IMPORTANT: Log out and log back in for environment variables to take effect."
          - ""
          - "To test immediately, run:"
          - "  STEAM_FORCE_DESKTOPUI_SCALING={{ steam_scale }} GDK_SCALE={{ steam_scale }} GDK_DPI_SCALE={{ steam_scale }} steam"
          - ""
          - "To change scale later, run:"
          - "  ansible-playbook steam-highdpi.yml -e 'steam_scale=2.0'"

# Optional: Task to kill running Steam (uncomment if needed)
#    - name: Kill running Steam process
#      shell: killall steam 2>/dev/null || true
#      ignore_errors: true
#      changed_when: false
